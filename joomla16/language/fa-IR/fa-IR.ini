JFIELD_ALIAS_DESC="نام متسعار انتخاب شده برای آدرس وب زمانی که SEF فعال باشد. به صورت خالي بگذاريد تا جوملا با استفاده از عنوان يک پيشفرض ايجاد نمايد.اين مقدار بر اساس تنظيمات seo است.  (پيکربندي کل-> سايت). <br />استفاده از يونيکد باعث ايجاد مستعارهاي  UTF8 مي شود. شما ممکن است که همچنين به صورت دستي هر کاراکتر utf8 وارد نماييد. فاصله و برخي از کاراکترهاي ممنوع  باعث تغيير آن مي شود.<br />اگر از ترجمه پيشفرض استفاده کنيد با استفاده از حروف کوچک يک مستعار ايجاد مي کند با خط فاصله به جاي فاصله. شما ممکن است که يک مستعار را به صورت دستي وارد نماييد . از حروف کوچک و  (-)استفاده کنيد. فاصله يا خط زير مجاز نست. در صورت استفاده از زبان غير لاتين مقدار پيشفرض زمان و تاريخ خواهد بود"
