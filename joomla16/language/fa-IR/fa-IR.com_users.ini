COM_USERS_EMAIL_ACTIVATE_WITH_ADMIN_ACTIVATION_BODY="مدیریت محترم وب سایت ، سلام علیکم,\n\nیک کاربر جدید در  %s ثبت نام نموده است.\n کاربر مورد نظر نشانی پست الکترونیک خود را تائید نموده است و منتظر فعال سازی توسط شما میباشد \nاین نامه حاوی مشخصات این کاربر میباشد :\n\n  نام :  %s \n  نشانی پست الکترونیک:  %s \n نام کاربری:  %s \n\n برای فعال سازی کاربر مورد نظر میتوانید برروی لینک زیر کلیک نمایید:\n %s \n"
