COM_USERS_EMAIL_ACTIVATED_BY_ADMIN_ACTIVATION_BODY="کاربر محترم ، سلام علیکم  %s,\n\nحساب کاربری شما توسط مدیریت سایت تائید و فعال گشت .اکنون شما میتوانید به   %sوارد شوید  و از نام کاربری  %s و رمزی که در هنگام ثبت نام درج نموده اید استفاده نمایید"
COM_USERS_EMAIL_ACTIVATED_BY_ADMIN_ACTIVATION_SUBJECT="فعال سازی حساب کاربری %s در %s"
COM_USERS_EMAIL_PASSWORD_RESET_BODY="کاربر محترم، سلام علیکم,\n\n وب سایت ما یک تقاضا برای بازسازی رمز ورود شما در %s دریافت نموده است. جهت بازسازی رمز عبور شما نیازمند ارسال کد بازسازی میباشید \n\nکد باز سازی رمز عبور شما : %s .\n\nلطفا بر روی لینک زیر کلیک نموده و کد بازسازی را وارد نمایید تا سیستم رمز ورود شما را باز سازی نماید .\n\n %s \n\ با تشکر - تیم مدیریت "
COM_USERS_EMAIL_PASSWORD_RESET_SUBJECT="درخواست بازنشانی رمز %s شما"
COM_USERS_EMAIL_REGISTERED_BODY="سلام  %s عزیز - به وب سایت ما خوش آمدید,\n\n از اینکه در وب سایت  %s ثبت نام نموده اید متشکریم.\n\n شما هم اکنون میتوانید در سایت  %s با استفاده از نام کاربری و رمزی که در هنگان ثبت نام اختیار نموده اید وارد قسمت مخصوص کاربرا سایت شوید. خوش آمدید"
COM_USERS_EMAIL_REGISTERED_WITH_ACTIVATION_BODY="سلام %s عزیز,\n\nاز اینکه در وب سایت %s ثبت نام نموده اید متشکریم. حساب کاربری شما ایجاد شده است و تنها میباید توسط خود شما فعال گردد\nTo  شما با کلیک بر روی لینک زیر میتوانید حساب کاربری خود را فعال نمایید و یا میتوانید این آدر را در آدرس بار مرورگرتان وارد نمایید\n%s \n\n پس از فعال سازی شما میتوانید به حساب کاربری خود با رمز و نام کاربری که ادامه میاید به وب سایت  %s وارد شوید \n\n نام کاربری و رمز عبور شما\n\nنام کاربری : %s\nرمز ورود : %s"
COM_USERS_EMAIL_REGISTERED_WITH_ADMIN_ACTIVATION_BODY="سلام %s عزیز,\n\nاز اینکه در وب سایت  %s ثبت نام نمودید متشکریم. حساب کاربری شما ایجاد شده است و شما برای ادامه فرآیند نیازمند فعال سازی آن میباشید.\nجهت تائید حساب کاربری خود بر لینک زیر کلیک کنید \n %s \n\nپس از تائید حساب توسط شما یک ایمیل به مدیریت سایت ارسال خواهد شد تا وی حساب کاربری شما را فعال نماید\nزمانی که حساب کاربری شما توسط مدیریت سایت فعال شد شما خواهید توانست به وب سایت  %s با استفاده از نام کاربری و رمز ورودی که اختیار نموده اید وارد شوید \n\nنام کاربری: %s\n رمز ورود : %s"
