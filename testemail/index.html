<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casual Brothers Email Test</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #12131b;
      --panel-2: #171923;
      --text: #f7f7f2;
      --muted: rgba(247, 247, 242, 0.58);
      --soft: rgba(247, 247, 242, 0.12);
      --brand: #7cff00;
      --danger: #ff5f5f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Montserrat, Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(124, 255, 0, 0.08), transparent 34%),
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.06), transparent 24rem),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(320px, 1.1fr);
      gap: 48px;
      align-items: center;
      padding: 64px 0;
    }

    .intro {
      display: grid;
      gap: 24px;
    }

    .mark {
      width: 64px;
      height: 64px;
      border: 1px solid rgba(124, 255, 0, 0.45);
      display: grid;
      place-items: center;
      color: var(--brand);
      font-weight: 900;
      letter-spacing: 0;
      background: rgba(124, 255, 0, 0.08);
    }

    h1 {
      margin: 0;
      max-width: 680px;
      font-size: clamp(42px, 7vw, 84px);
      line-height: 0.92;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .intro p {
      margin: 0;
      max-width: 540px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .status-card {
      border: 1px solid var(--soft);
      background: rgba(255, 255, 255, 0.03);
      padding: 18px;
      display: grid;
      gap: 8px;
    }

    .status-card span {
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .status-card strong {
      font-size: 15px;
      font-weight: 700;
    }

    form {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      padding: 28px;
      display: grid;
      gap: 18px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      color: rgba(247, 247, 242, 0.76);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      padding: 14px 15px;
      outline: none;
      transition: border-color 160ms ease, background 160ms ease;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(124, 255, 0, 0.76);
      background: var(--panel-2);
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    button {
      min-height: 52px;
      border: 1px solid var(--brand);
      border-radius: 0;
      background: var(--brand);
      color: #050505;
      font: inherit;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      filter: grayscale(0.5);
      opacity: 0.7;
      transform: none;
    }

    .hidden-field {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    #result {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    #result.ok {
      color: var(--brand);
    }

    #result.error {
      color: var(--danger);
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-label="Email test">
      <div class="mark">CB</div>
      <h1>Email Test</h1>
      <p>
        Standalone test form for the new website. It posts to a PHP endpoint in this folder and sends a plain-text email to contact@casualbrothers.com.
      </p>
      <div class="status-card">
        <span>Transport</span>
        <strong>PHP mail() · no WordPress · no SMTP password</strong>
      </div>
    </section>

    <form id="contactForm" action="send.php" method="post">
      <div class="row">
        <label>
          Name
          <input name="name" autocomplete="name" required>
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
      </div>

      <label>
        Subject
        <input name="subject" value="Newweb email test" required>
      </label>

      <label>
        Message
        <textarea name="message" required>Testing email delivery from /testemail.</textarea>
      </label>

      <label class="hidden-field" aria-hidden="true">
        Website
        <input name="website" tabindex="-1" autocomplete="off">
      </label>

      <button type="submit">Send Test</button>
      <div id="result" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.querySelector('#contactForm');
    const result = document.querySelector('#result');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      result.className = '';
      result.textContent = 'Sending...';
      button.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: {
            Accept: 'application/json'
          }
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.ok) {
          throw new Error(data.error || 'The server could not send the email.');
        }

        result.className = 'ok';
        result.textContent = 'Sent. Check contact@casualbrothers.com.';
        form.reset();
        form.elements.subject.value = 'Newweb email test';
        form.elements.message.value = 'Testing email delivery from /testemail.';
      } catch (error) {
        result.className = 'error';
        result.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
